# Derived from the working nmme_workflow_env package set.
# This keeps the important top-level workflow dependencies pinned while
# allowing Conda to solve the rest of the environment.
name: subc_workflow_env
channels:
  - conda-forge
  - iri-nextgen
  - defaults
dependencies:
  - python=3.10.13
  - cartopy=0.22.0
  - cmaps=2.0.1
  - cptbin=17.8.3
  - dask=2024.2.0
  - distributed=2024.2.0
  - geocat-viz=2025.07.0
  - ipykernel=6.29.2
  - jupyter=1.0.0
  - matplotlib=3.7.1
  - metpy=1.7.1
  - netcdf4=1.6.5
  - numpy=1.26.4
  - pandas=2.2.0
  - pycpt=2.10.4
  - pyproj=3.6.1
  - pyyaml=6.0.1
  - requests=2.31.0
  - scikit-learn=1.4.1.post1
  - scipy=1.12.0
  - shapely=2.0.3
  - xarray=2024.2.0