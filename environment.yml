# Main workflow environment (ingest, arraylake, preprocess, products, publish).
# Does NOT include PyCPT/CPT packages — use environment.pycpt-2.8.2.yml for
# the pycpt stage.
name: subc_workflow_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - cartopy=0.22.0
  - cmaps=2.0.1
  - dask=2024.2.0
  - distributed=2024.2.0
  - geocat-viz=2025.07.0
  - ipykernel=6.29.2
  - jupyter=1.0.0
  - matplotlib=3.7.1
  - metpy=1.7.1
  - netcdf4=1.6.5
  - numpy=1.26.4
  - pandas=2.2.0
  - pyproj=3.6.1
  - pyyaml=6.0.1
  - pytest=9.0.2
  - requests=2.31.0
  - scikit-learn=1.4.1.post1
  - scipy=1.12.0
  - shapely=2.0.3
  - tqdm
  - wget
  - xarray>=2024.10.0
  - icechunk
  - pip
  - pip:
      - arraylake