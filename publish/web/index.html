 <script>
  var regionsByVar = {
    "2mTemp": ["Global", "NorthAmerica", "Iran", "Mexico", "Venezuela"],
    "Precip": ["Global", "NorthAmerica", "Iran", "Mexico", "Venezuela"],
    "PrecipExceedance": ["Global", "NorthAmerica", "CAsia", "Iran", "Mexico", "Venezuela"],
    "TempExceedance": ["Global", "NorthAmerica", "CAsia", "Iran", "Mexico", "Venezuela"],
    "PrecipDrought": ["Global", "NorthAmerica", "CAsia", "Iran", "Mexico", "Venezuela"],
    "500hPaGeopotentialHeightNorthernHemisphere": ["NorthernHemisphere"]
  };

  var regionLabels = {
    "NorthAmerica": "North America",
    "Global": "Global",
    "CAsia": "Central Asia",
    "Iran": "Iran",
    "Mexico": "Mexico",
    "Venezuela": "Venezuela",
    "NorthernHemisphere": "Northern Hemisphere"
  };

  var exceedanceWeekLeads = [
    {value: "wk1", text: "Week 1"},
    {value: "wk2", text: "Week 2"},
    {value: "wk3", text: "Week 3"},
    {value: "wk4", text: "Week 4"}
  ];

  // Maps each exceedance dropdown value to the short variable code and the
  // {var}_p{percentile}_{direction} filename tag used by products/forecast.py.
  var exceedanceProductTags = {
    "PrecipExceedance": {var: "pr",  tag: "p95_above"},
    "TempExceedance":   {var: "tas", tag: "p95_above"},
    "PrecipDrought":    {var: "pr",  tag: "p5_below"}
  };

  var leadsByVar = {
    "PrecipExceedance": exceedanceWeekLeads,
    "TempExceedance": exceedanceWeekLeads,
    "PrecipDrought": exceedanceWeekLeads,
    "default": [
      {value: "Weeks34", text: "Weeks 3&4"},
      {value: "Week1",   text: "Week 1"},
      {value: "Week2",   text: "Week 2"},
      {value: "Week3",   text: "Week 3"},
      {value: "Week4",   text: "Week 4"}
    ]
  };

  function updateRegions() {
    var varVal = document.getElementById("fcstselectvar").value;
    var regionSel = document.getElementById("fcstselectregion");
    regionSel.innerHTML = "";
    var regions = regionsByVar[varVal] || [];
    regions.forEach(function(r) {
      var opt = document.createElement("option");
      opt.value = r;
      opt.text = regionLabels[r] || r;
      regionSel.appendChild(opt);
    });

    // Update lead options for exceedance (no Weeks3&4 combined)
    var leadSel = document.getElementById("fcstselectlead");
    var prevLead = leadSel.value;
    leadSel.innerHTML = "";
    var leads = leadsByVar[varVal] || leadsByVar["default"];
    leads.forEach(function(l) {
      var opt = document.createElement("option");
      opt.value = l.value;
      opt.text = l.text;
      leadSel.appendChild(opt);
    });
    // Restore prior selection if still available
    if (Array.from(leadSel.options).some(function(o) { return o.value === prevLead; })) {
      leadSel.value = prevLead;
    }
  }

  function myFunction() {
    var date = document.getElementById("fcstselectdate").value.trim().replace(/ /g, '');
    var varVal = document.getElementById("fcstselectvar").value;
    var region = document.getElementById("fcstselectregion").value;
    var lead = document.getElementById("fcstselectlead").value;
    var text;

    if (exceedanceProductTags.hasOwnProperty(varVal)) {
      // Exceedance files live in a per-region subdirectory with the date in the filename.
      // "Latest" symlink dir uses the actual init date in filenames, so resolve to the
      // most recent actual date when Latest is selected.
      if (date === "Latest") {
        var dateSel = document.getElementById("fcstselectdate");
        for (var i = 0; i < dateSel.options.length; i++) {
          var v = dateSel.options[i].value.trim();
          if (/^\d{8}$/.test(v)) { date = v; break; }
        }
      }
      // lead is already in wk1..wk4 form for exceedance
      var product = exceedanceProductTags[varVal];
      text = 'images/' + date + '/' + region + '/exceed_mme_' + product.var + '_' + product.tag + '_' + region + '_' + date + '_' + lead + '.png';
    } else {
      var name = varVal;
      if (varVal !== "500hPaGeopotentialHeightNorthernHemisphere") {
        name = varVal + region;
      }
      text = 'images/' + date + '/' + name + lead + '.png';
    }
    document.getElementById('fcstImage').src = text;
  }

  // Initialize regions on load
  updateRegions();
  myFunction();
 </script>
