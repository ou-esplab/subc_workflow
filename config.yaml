
fcstdate: null
lon_convention: "0_360"
paths:
  rt_root: /data/esplab/subc-backup
  hc_root: /data/esplab/shared/model/initialized/subx/hindcast
  out_weekly: /data/esplab/shared/model/initialized/subx/forecast/weekly
  out_daily: /data/esplab/shared/model/initialized/subx/forecast/daily
  pycpt_case_root: /data/esplab/shared/model/initialized/subx/forecast/weekly/pycpt
  thresholds_template: /data/esplab/gbrown/GWSC/percentile{percentile}_{modelkey}_thres_{var}.nc
  thresholds_gefs_pr: /data/esplab/gbrown/GWSC/percentile{percentile}_GEFSthres_pr.nc
models:
  - { group: ECCC, name: GEPS8,            vars: [pr, rlut, tas, ts, ua, va, zg], levels: [sfc, sfc, 2m, sfc, 200, 200, 500] }
  - { group: EMC,  name: GEFSv12_CPC,      vars: [pr, tas, zg],                   levels: [sfc, 2m, 500] }
  - { group: ESRL, name: FIMr1p1,          vars: [pr, rlut, tas, ts, ua, va, zg], levels: [sfc, sfc, 2m, sfc, 200, 200, 500] }
  - { group: GMAO, name: GEOS_V2p1_5daily, vars: [pr, rlut, tas, ts, ua, va, zg], levels: [sfc, sfc, 2m, sfc, 200, 200, 500] }
  - { group: NCEP, name: CFSv2,            vars: [tas, pr, zg],                   levels: [2m, sfc, 500] }
  - { group: RSMAS,name: CCSM4,            vars: [pr, rlut, tas, ts, ua, va, zg], levels: [sfc, sfc, 2m, sfc, 200, 200, 500] }

model_name_map:
  GMAO-GEOS_V2p1_5daily: GEOS_V2p1

ingest:
  # Default source for model downloads. Keep as iridl for shadow-mode rollout.
  source_default: iridl
  # Set false to run shadow-only ingest for direct-source testing.
  primary_enabled: true
  # Optional per-model source overrides using GROUP-MODEL keys.
  # Keep empty while downstream remains on IRIDL.
  # Supported values: iridl, direct, direct_esrl, direct_gmao, direct_eccc, direct_rsmas
  model_source:
    ECCC-GEPS8: direct_eccc
    NCEP-CFSv2: direct_cfs
    EMC-GEFSv12_CPC: direct_gefs
  # Optional shadow ingest that runs in parallel and writes to a separate root.
  # This is used to validate direct-source ingest without changing downstream
  # stages that read from paths.rt_root.
  shadow:
    enabled: false
    rt_root: /data/esplab/subc-backup-direct-shadow
    model_source:
      ESRL-FIMr1p1: direct_esrl
      GMAO-GEOS_V2p1_5daily: direct_gmao
      ECCC-GEPS8: direct_eccc
      RSMAS-CCSM4: direct_rsmas
  # Lookback window used by direct source discovery if provider listings expose
  # multiple initializations.
  lookback_days: 7
  direct:
    # Anonymous FTP password for provider endpoints that require an email.
    # Prefer setting SUBX_DIRECT_FTP_EMAIL in the runtime environment.
    ftp_email: anonymous@example.com
    # ECCC tar archives include ensemble members (m00-m20). By default,
    # downloader selects the first available member in this configured order.
    eccc:
      member: m00-m20
      # Select the correct pressure level from ECCC per-level tar files (e.g. ua_200_ECCC_...).
      # Without this, alphabetical ordering picks 100mb instead of 200mb for ua/va, and 200mb for zg.
      var_levels:
        ua: 200
        va: 200
        zg: 500
    providers:
      esrl:
        url: ftp://gsdftp.fsl.noaa.gov/SubX-ESRL-FIMr1.1/
      gmao:
        url: https://gmao.gsfc.nasa.gov/gmaoftp/gmaofcst/subx/GEOS_S2S_V2.1_fcst/pr1/
      gmao_v3:
        url: https://portal.nccs.nasa.gov/datashare/gmao/geos-s2s-3/NRT/SubC/
      eccc:
        url: https://collaboration.cmc.ec.gc.ca/cmc/CMOI/GRIB/GEPS/forecast/subX_fcst/
      rsmas:
        url: ftp://decadal.rsmas.miami.edu/pub/CPC_DATA/CCSM4/forecast/priority1/
  
exceedance:
  var: pr
  lev: sfc
  max_fallback_days: 7
  model_id: EMC-GEFSv12_CPC
  percentile: 95
  window_days: 7
  modelkey: GEFSthres
pycpt_regions:
  - Venezuela
  - Iran
  - Mexico
regions:
  - name: Global
    subx:  { lon: [0, 360], lat: [-90, 90] }
    pycpt: { lon: [-180, 180], lat: [-90, 90] }
  - name: NorthAmerica
    subx:  { lon: [190, 305], lat: [15, 75] }
    pycpt: { lon: [-170, -55], lat: [15, 75] }
  - name: Venezuela
    subx:  { lon: [287, 300], lat: [0, 13] }
    pycpt: { lon: [-60, -73], lat: [0, 13] }
  - name: Iran
    subx:  { lon: [40, 64],  lat: [24, 40] }
    pycpt: { lon: [40, 64],  lat: [24, 40] }
  - name: Mexico
    subx:  { lon: [242, 263], lat: [20, 33] }
    pycpt: { lon: [-118, -97], lat: [20, 33] }
  - name: CAsia
    subx:  { lon: [45, 89], lat: [29, 56] }
    pycpt: { lon: [45, 89], lat: [29, 56] }
pycpt:
  # Local CHIRPS daily data directory and variable name for building weekly files if needed
  local_chirps_daily_dir: /data/esplab/shared/obs/gridded/atm/precip/daily/chirps-v2.0/p25
  local_chirps_var: precip
  mos: CCA
  training_season: Feb-Apr
  # Optional predictor variable suffix used when building predictor names
  # from model_group entries. Common values: PRCP, T2M, TMP.
  predictor_var: PRCP
  # Optional model group for PyCPT predictor selection (local model IDs).
  # Example: [EMC-GEFSv12_CPC, NCEP-CFSv2]
  # If omitted, falls back to local_subx_model_id.
  model_group: []
  # Optional explicit predictor-name mapping when local model IDs do not
  # match PyCPT naming conventions.
  # predictor_name_map:
  #   EMC-GEFSv12_CPC: GEFSv12.PRCP
  #   NCEP-CFSv2: CFSv2.PRCP
  predictor_name_map: {}
  # Optional explicit predictor names (highest priority).
  # If set, these names are used directly by PyCPT download/evaluation.
  predictor_names: []
  # Optional local-data mode to avoid downloads in pycpt_s2s_realtime.py.
  use_local_data: true
  local_data_dir: /data/esplab/subc-backup/
  # Optional mode to build PyCPT predictor files directly from local SubX archive:
  #   <root>/<GROUP>-<MODEL>/<forecast,hindcast>/<var>/<var>_<GROUP>-<MODEL>_YYYYMMDD.daily.nc
  use_local_subx_predictor: false
  local_subx_root: /data/esplab/subc-backup
  local_subx_model_id: EMC-GEFSv12_CPC
  local_data_strict: true
  force_download: false
  # Optional cptdl target keyword used for seasonal-length checks; defaults to init month.
  target: null
email:
  enabled: false
  smtp_host: smtp.example.org
  smtp_port: 587
  use_tls: true
  username: ${SMTP_USER}
  password: ${SMTP_PASS}
  from: kpegion@ou.edu
  to: [kpegion@ou.edu]
validation:
  policy: warn_on_missing  # Use all available data; missing inputs are warnings, not errors
  lookback_days: 7         # Use newest available realtime file within the last N days
  expect_any_member: true
concurrency:
  downloads: 3

arraylake:
  enabled: true 
  repo: ou-subc/subc-forecasts
  branch: main
  input_root: /data/esplab/subc-backup
  batch_size: 1
  variables: [pr, tas, rlut, ts, ua, va, zg]
  skip_models: [NCEP-CFSv2, GMAO-GEOS_V3]
  # Optional per-model variable overrides. If omitted, arraylake.variables is used.
  # Example:
  #   model_vars:
  #     ECCC-GEPS8: [pr, tas]
  model_vars:
    ECCC-GEPS8: [pr, rlut, tas, ts, zg]  # ua/va excluded: format changed to 100mb-only, no P dim
